<style>:root{--bg:#F5F7FF;--ink:#0B0B1A;--muted:#4B4E6B;--line:#D9DDF2;--violet:#7C3AED;--violet-d:#5B21B6;--cyan:#0891B2;--paper:#FFFFFF;--r:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 "Sora",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}a{color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
header.top{padding:1.25rem 0;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem}
header.top img{height:40px;width:auto}
nav{display:flex;gap:1.75rem;align-items:center;font-size:.95rem}
nav a{text-decoration:none;color:var(--muted);padding:.25rem 0;border-bottom:2px solid transparent}
nav a:hover,nav a[aria-current]{color:var(--ink);border-color:var(--violet)}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:.98rem;padding:.85rem 1.4rem;border-radius:999px;border:2px solid var(--ink);cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s}
.btn:hover{background:var(--violet);border-color:var(--violet)}
.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
nav a.btn{color:#fff;border-bottom:2px solid var(--ink);padding:.6rem 1.1rem}
h1,h2,h3{line-height:1.12;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:700}
h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:700}
h3{font-size:1.2rem;font-weight:600;letter-spacing:-.01em}
p{margin:0;max-width:62ch}
.hero{padding:clamp(3rem,8vw,6.5rem) 0;display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center}
.hero p.lead{font-size:1.2rem;color:var(--muted);margin:1.5rem 0 2rem}
.actions{display:flex;gap:.9rem;flex-wrap:wrap}
.sky{width:100%;max-width:460px;margin-inline:auto}
.sky .ln{stroke:var(--ink);stroke-opacity:.28;stroke-width:1.5;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.2s .2s ease-out forwards}
.sky .a{stroke:var(--ink);stroke-opacity:1;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.6s ease-out forwards}
.sky circle{opacity:0;animation:pop .5s 1.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1}}
section.block{padding:clamp(3rem,7vw,5.5rem) 0;border-top:1px solid var(--line)}
.split{display:grid;grid-template-columns:.8fr 1.2fr;gap:3rem}
.split>div>p{color:var(--muted);margin-top:1rem}
.svc{list-style:none;margin:0;padding:0}
.svc li{display:grid;grid-template-columns:3.2rem 1fr;gap:1rem;padding:1.5rem 0;border-bottom:1px solid var(--line)}
.svc li:first-child{padding-top:0}
.svc svg{width:2.4rem;height:2.4rem;stroke:var(--violet);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.svc p{color:var(--muted);margin-top:.35rem}
.audience{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:2rem;padding:0;list-style:none}
.audience li{padding:.55rem 1.1rem;border:1.5px solid var(--ink);border-radius:999px;font-weight:500;font-size:.98rem}
.cta{background:var(--ink);color:#fff;border-radius:28px;padding:clamp(2rem,5vw,4rem);display:flex;justify-content:space-between;align-items:center;gap:2rem;flex-wrap:wrap;margin-block:2rem 4.5rem}
.cta p{color:#B9BCD9;margin-top:.7rem}
.cta .btn{background:#fff;color:var(--ink);border-color:#fff}.cta .btn:hover{background:#22D3EE;border-color:#22D3EE}
footer{border-top:1px solid var(--line);padding:2rem 0 2.5rem;color:var(--muted);font-size:.92rem}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
footer img{height:32px;width:auto}
footer nav{font-size:.92rem}
/* contact */
.page{padding:clamp(3rem,7vw,5.5rem) 0;display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(2rem,6vw,5rem)}
.page .lead{color:var(--muted);margin-top:1.2rem;font-size:1.12rem}
.ways{margin:2.2rem 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.ways li{padding:1rem 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.ways span{color:var(--muted)}.ways a{font-weight:600}
form{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:clamp(1.4rem,4vw,2.4rem);display:grid;gap:1.15rem}
label{display:grid;gap:.4rem;font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:.8rem 1rem;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.18)}
textarea{min-height:150px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1.15rem}
.note{font-size:.88rem;color:var(--muted)}
#status{font-size:.95rem;font-weight:600;color:var(--violet-d);min-height:1.4em}
/* 404 */
.lost{min-height:62vh;display:grid;place-items:center;text-align:center;padding:3rem 0}
.lost .num{display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:clamp(6rem,20vw,12rem);font-weight:700;letter-spacing:-.05em;line-height:1}
.lost .num svg{width:.78em;height:.78em;overflow:visible}
.lost h1{font-size:clamp(1.6rem,4vw,2.3rem);margin-top:1rem}
.lost p{color:var(--muted);margin:1rem auto 2rem}
.lost .actions{justify-content:center}
@media(max-width:820px){.hero,.split,.page{grid-template-columns:1fr}.sky{max-width:320px;order:-1}.row{grid-template-columns:1fr}nav a:not(.btn){display:none}}
@media(prefers-reduced-motion:reduce){.sky .ln,.sky .a{animation:none;stroke-dashoffset:0}.sky circle{animation:none;opacity:1}html{scroll-behavior:auto}}

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header.top img,header.top svg{height:40px;width:auto}footer svg{height:32px;width:auto}
</style></head><body>
